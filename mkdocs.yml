site_name: Epistemic Channel Divergence
site_description: Measuring divergence between behavioral and declarative beliefs in LLMs
site_url: https://meadowlark-bradsher.github.io/epistemic-channel-divergence/

theme:
  name: material
  palette:
    scheme: slate
    primary: deep-purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Methods: methods/methods.md
  - Findings:
    - Overview: findings/index.md
    - Uniform Attractor: findings/uniform-attractor.md
    - Belief-Action Decoupling: findings/belief-action-decoupling.md
    - Probe Order Effects: findings/probe-order-effects.md
    - Gravitational Pull: findings/gravitational-pull.md
    - Structural Sensitivity: findings/structural-sensitivity.md
    - Measurement Implications: findings/measurement-implications.md
  - Experiments:
    - Overview: experiments/index.md
    - Belief Probe Baseline: experiments/belief-probe.md
    - Gravitational Pull: experiments/gravitational-pull.md
    - Alignment Regularizer: experiments/alignment-regularizer.md
    - ESI: experiments/esi.md
    - Ensemble Bootstrap: experiments/ensemble-bootstrap.md
    - Jev Action Channel: experiments/jev-action-channel.md
  - Lab Notes:
    - Belief Probe Notes: labnotes/belief-probe-notes.md
    - Gravitational Pull: labnotes/gravitational-pull-experiment.md
    - Token vs Stated Belief: labnotes/token-belief-vs-stated-belief.md
    - ESI Experiment: labnotes/esi-experiment.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
